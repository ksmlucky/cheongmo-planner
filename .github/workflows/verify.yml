name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test cheongmo/tests/logic.test.mjs
      - run: node cheongmo/build-standalone.mjs
      - run: node cheongmo/check-standalone.mjs
      - run: git diff --exit-code -- 청모.html
