<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">청모 플래너 기능 요약</title><desc id="desc">초대할 사람과 서로 아는 관계를 바탕으로 모임을 조합하고, 날짜·장소·안내문까지 준비하는 개인용 웹 플래너입니다. 사람과 관계: 초대할 사람을 등록: 아는 사이·따로 만나기 → 모임 조합: 관계를 반영한 추천: 직접 조정하는 그룹 → 약속 정리: 날짜·장소·완료 기록: 안내문 복사·백업 설명용 도식입니다.</desc><rect width="1200" height="720" rx="24" fill="#FBF3E8"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, Arial, sans-serif" fill="#3D3027"><rect x="52" y="47" width="7" height="25" rx="3" fill="#B75E38"/><text x="74" y="67" font-size="21" font-weight="600" fill="#B75E38">개인 프로젝트 · 청첩장 모임 준비</text><text x="52" y="148" font-size="58" font-weight="800" letter-spacing="-2">청모 플래너</text><text x="54" y="203" font-size="28" letter-spacing="-.6">사람과 관계를 정리하고, 편안한 모임을 계획합니다.</text><text x="54" y="257" font-size="17" letter-spacing="3" fill="#B75E38">HOW IT WORKS</text><g transform="translate(52,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#F1DFC9"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#B75E38">01</text><g transform="translate(60,51)"><circle cx="58" cy="30" r="13" fill="none" stroke="#B75E38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 79v-9a20 20 0 0 1 40 0v9" fill="none" stroke="#B75E38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="119" cy="30" r="13" fill="none" stroke="#B75E38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M99 79v-9a20 20 0 0 1 40 0v9" fill="none" stroke="#B75E38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="180" cy="30" r="13" fill="none" stroke="#B75E38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M160 79v-9a20 20 0 0 1 40 0v9" fill="none" stroke="#B75E38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">사람과 관계</text><text x="28" y="248" font-size="23">초대할 사람을 등록</text><text x="28" y="281" font-size="23" fill="#B75E38">아는 사이·따로 만나기</text></g><g transform="translate(422,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#F1DFC9"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#B75E38">02</text><g transform="translate(60,51)"><path d="M49 57L120 20L190 57L120 94Z M49 57H190 M120 20V94" fill="none" stroke="#B75E38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="49" cy="57" r="12" fill="white" stroke="#B75E38" stroke-width="3"/><circle cx="120" cy="20" r="12" fill="white" stroke="#B75E38" stroke-width="3"/><circle cx="190" cy="57" r="12" fill="white" stroke="#B75E38" stroke-width="3"/><circle cx="120" cy="94" r="12" fill="white" stroke="#B75E38" stroke-width="3"/></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">모임 조합</text><text x="28" y="248" font-size="23">관계를 반영한 추천</text><text x="28" y="281" font-size="23" fill="#B75E38">직접 조정하는 그룹</text></g><g transform="translate(792,280)"><rect width="356" height="315" rx="20" fill="white"/><rect x="20" y="20" width="39" height="29" rx="8" fill="#F1DFC9"/><text x="39.5" y="41" text-anchor="middle" font-size="16" font-weight="700" fill="#B75E38">03</text><g transform="translate(60,51)"><rect x="65" y="8" width="112" height="90" rx="8" fill="none" stroke="#B75E38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M65 32H177 M91 1v15 M151 1v15" fill="none" stroke="#B75E38" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="91" cy="53" r="5" fill="#B75E38"/><circle cx="91" cy="78" r="5" fill="#B75E38"/><circle cx="121" cy="53" r="5" fill="#B75E38"/><circle cx="121" cy="78" r="5" fill="#B75E38"/><circle cx="151" cy="53" r="5" fill="#B75E38"/><circle cx="151" cy="78" r="5" fill="#B75E38"/></g><text x="28" y="207" font-size="30" font-weight="700" letter-spacing="-1">약속 정리</text><text x="28" y="248" font-size="23">날짜·장소·완료 기록</text><text x="28" y="281" font-size="23" fill="#B75E38">안내문 복사·백업</text></g><line x1="54" y1="629" x2="1146" y2="629" stroke="#B75E38" opacity=".2"/><text x="54" y="668" font-size="20" fill="#B75E38">관계를 직접 입력하는 규칙 기반 추천 · 기기 간 자동 동기화 없음</text><text x="1145" y="701" text-anchor="end" font-size="12" letter-spacing="1.4" opacity=".65">FEATURE OVERVIEW · NOT A LIVE SCREENSHOT</text></g></svg>